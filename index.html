                  </div>
                </div>

              </form>
            </div>

            <div className="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
              <button onClick={onClose} type="button" className="px-5 py-2.5 border border-gray-300 rounded-lg text-sm font-medium bg-white hover:bg-gray-100 transition-colors">ยกเลิก</button>
              <button type="submit" form="update-status-form" disabled={isSaving} className="px-5 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 transition-colors shadow-sm disabled:opacity-60">{isSaving ? 'กำลังบันทึก...' : 'บันทึกการเปลี่ยนแปลง'}</button>
            </div>
          </div>
        </div>
      );
    };

    // PatientList
    const PatientList = ({ patients, onDelete, onUpdateStatus, onViewHistory, settings, currentUser }) => {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('All');
      const [filterYear, setFilterYear] = useState('All');
      const [selectedPatient, setSelectedPatient] = useState(null);
      const [confirmDeleteTarget, setConfirmDeleteTarget] = useState(null);

      const availableYears = useMemo(() => {
        const years = new Set((patients || []).map(p => getFiscalYear(p.medReadyDate)).filter(Boolean));
        return Array.from(years).sort().reverse();
      }, [patients]);

      const sortedPatients = useMemo(() => {
        return (patients || []).filter(p => {
          const searchStr = searchTerm.toLowerCase();
          const matchesSearch = String(p.name || '').toLowerCase().includes(searchStr) ||
                                String(p.hn || '').toLowerCase().includes(searchStr) ||
                                String(p.an || '').toLowerCase().includes(searchStr) ||
                                String(p.icd10 || '').toLowerCase().includes(searchStr);
          const matchesStatus = filterStatus === 'All' || p.status === filterStatus;
          const matchesYear = filterYear === 'All' || getFiscalYear(p.medReadyDate) === filterYear;
          return matchesSearch && matchesStatus && matchesYear;
        }).sort((a, b) => (Number(b.extraDays) || 0) - (Number(a.extraDays) || 0)); // เคสวิกฤตสุดขึ้นก่อนเสมอ
      }, [patients, searchTerm, filterStatus, filterYear]);

      const handleConfirmDelete = () => {
        if (confirmDeleteTarget) onDelete(confirmDeleteTarget.id);
        setConfirmDeleteTarget(null);
      };

      return (
        <div className="space-y-4">
          <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6">
            <h2 className="text-2xl font-bold text-gray-800">ทะเบียนผู้ป่วยจำหน่ายยาก</h2>
            <div className="flex flex-wrap gap-3">
              <div className="relative">
                <Search className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4" />
                <input type="text" placeholder="ค้นหา HN, AN, ชื่อ, ICD10..." className="pl-9 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 shadow-sm transition-shadow" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
              </div>
              <select className="border border-gray-300 rounded-lg text-sm px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm" value={filterYear} onChange={(e) => setFilterYear(e.target.value)}>
                <option value="All">ปีงบประมาณ (ทั้งหมด)</option>
                {availableYears.map(y => <option key={y} value={y}>ปี {y}</option>)}
              </select>
              <select className="border border-gray-300 rounded-lg text-sm px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                <option value="All">สถานะ (ทั้งหมด)</option>
                {Object.entries(statusConfig).map(([key, config]) => <option key={key} value={key}>{config.label}</option>)}
              </select>
            </div>
          </div>

          {/* ตาราง: จอกว้าง */}
          <div className="hidden md:block bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden overflow-x-auto">
            <table className="w-full text-left text-sm text-gray-600">
              <thead className="bg-gray-50 text-gray-700 border-b border-gray-200">
                <tr>
                  <th className="px-4 py-4 font-semibold min-w-[150px]">ผู้ป่วย (HN / AN)</th>
                  <th className="px-4 py-4 font-semibold">โรค (ICD10)</th>
                  <th className="px-4 py-4 font-semibold">หอผู้ป่วย</th>
                  <th className="px-4 py-4 font-semibold">วันที่ให้กลับ</th>
                  <th className="px-4 py-4 font-semibold text-center">ส่วนเกิน(วัน)</th>
                  <th className="px-4 py-4 font-semibold min-w-[150px]">สาเหตุ / ปลายทาง</th>
                  <th className="px-4 py-4 font-semibold min-w-[200px]">การส่งหนังสือราชการ</th>
                  <th className="px-4 py-4 font-semibold">สถานะปัจจุบัน</th>
                  <th className="px-4 py-4 font-semibold text-center min-w-[140px]">{currentUser?.role === 'viewer' ? 'ประวัติ' : 'จัดการ / ประวัติ'}</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-100">
                {sortedPatients.map(patient => (
                  <tr key={patient.id} className="hover:bg-blue-50/50 transition-colors">
                    <td className="px-4 py-3">
                      <div className="font-semibold text-gray-900">{patient.name}</div>
                      <div className="text-xs text-gray-500 mt-0.5">HN: {patient.hn} | AN: {patient.an || '-'}</div>
                    </td>
                    <td className="px-4 py-3">
                      {patient.icd10 && patient.icd10 !== '-' ? <span className="inline-flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-100 font-medium text-xs"><Stethoscope className="w-3 h-3"/> {patient.icd10}</span> : '-'}
                    </td>
                    <td className="px-4 py-3">{patient.ward}</td>
                    <td className="px-4 py-3 text-gray-500">{patient.medReadyDate}</td>
                    <td className="px-4 py-3 text-center"><span className={`font-bold text-base ${patient.extraDays >= (settings?.criticalDays || 30) ? 'text-red-600' : patient.extraDays > 14 ? 'text-orange-500' : 'text-gray-700'}`}>{patient.extraDays}</span></td>
                    <td className="px-4 py-3"><div className="truncate max-w-[150px] font-medium text-gray-800">{patient.reason}</div><div className="text-xs text-blue-600 truncate max-w-[150px] mt-0.5">{patient.agency !== '-' ? patient.agency : ''}</div></td>
                    <td className="px-4 py-3">
                      {patient.letterNo && patient.letterNo !== '-' ? (
                        <div className="text-xs space-y-1">
                          <div className="font-medium text-gray-800 flex items-center gap-1"><Mail className="w-3 h-3 text-gray-400"/>{patient.letterNo}</div>
                          <div className="text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded inline-block border border-gray-200">ถึง: {patient.letterAgency || '-'}</div>
                          <div className={`font-semibold ${patient.letterStatus === 'หน่วยงานตอบรับแล้ว' ? 'text-emerald-600' : patient.letterStatus === 'หน่วยงานปฏิเสธ/เตียงเต็ม' ? 'text-red-500' : 'text-orange-500'}`}>สถานะ: {patient.letterStatus}</div>
                        </div>
                      ) : <span className="text-gray-400 text-xs italic">ไม่มีหนังสือ</span>}
                    </td>
                    <td className="px-4 py-3">
                      <StatusBadge status={patient.status} />
                      {patient.status === 'Discharged To Agency' && (
                        <div className="text-[11px] text-cyan-700 mt-1 space-y-0.5">
                          {patient.dischargeAgency && patient.dischargeAgency !== '-' && <div className="font-medium truncate max-w-[140px]">ฝาก: {patient.dischargeAgency}</div>}
                          {patient.dischargeDate && patient.dischargeDate !== '-' && <div>มาแล้ว {calculateExtraDays(patient.dischargeDate)} วัน</div>}
                          {patient.dischargeFinalStatus && patient.dischargeFinalStatus !== '-' && dischargeFinalStatusConfig[patient.dischargeFinalStatus] && (
                            <span className={`inline-block px-1.5 py-0.5 rounded border text-[10px] font-medium ${dischargeFinalStatusConfig[patient.dischargeFinalStatus].color}`}>{dischargeFinalStatusConfig[patient.dischargeFinalStatus].label}</span>
                          )}
                        </div>
                      )}
                    </td>
                    <td className="px-4 py-3 text-center">
                      <div className="flex items-center justify-center gap-2">
                        <button onClick={() => onViewHistory(patient)} className="text-emerald-600 hover:text-emerald-800 p-1.5 bg-emerald-50 rounded-md hover:bg-emerald-100 transition-colors border border-emerald-100" title="ประวัติการอัปเดต"><HistoryIcon className="w-4 h-4" /></button>
                        {currentUser?.role !== 'viewer' && (
                          <>
                            <button onClick={() => setSelectedPatient(patient)} className="text-blue-600 hover:text-blue-800 p-1.5 bg-blue-50 rounded-md hover:bg-blue-100 transition-colors border border-blue-100" title="อัปเดตสถานะ"><Edit className="w-4 h-4" /></button>
                            <button onClick={() => setConfirmDeleteTarget(patient)} className="text-red-500 hover:text-red-700 p-1.5 bg-red-50 rounded-md hover:bg-red-100 transition-colors border border-red-100" title="ลบข้อมูล"><Trash2 className="w-4 h-4" /></button>
                          </>
                        )}
                      </div>
                    </td>
                  </tr>
                ))}
                {sortedPatients.length === 0 && <tr><td colSpan="9" className="px-4 py-8 text-center text-gray-400">ไม่พบข้อมูลที่ค้นหา</td></tr>}
              </tbody>
            </table>
          </div>

          {/* การ์ด: จอมือถือ */}
          <div className="md:hidden space-y-3">
            {sortedPatients.map(patient => (
              <div key={patient.id} className="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                <div className="flex justify-between items-start gap-2 mb-3">
                  <div>
                    <div className="font-semibold text-gray-900">{patient.name}</div>
                    <div className="text-xs text-gray-500 mt-0.5">HN: {patient.hn} | AN: {patient.an || '-'}</div>
                  </div>
                  <div className="text-right">
                    <StatusBadge status={patient.status} />
                    {patient.status === 'Discharged To Agency' && (
                      <div className="text-[11px] text-cyan-700 mt-1 space-y-0.5">
                        {patient.dischargeAgency && patient.dischargeAgency !== '-' && <div className="font-medium">ฝาก: {patient.dischargeAgency}</div>}
                        {patient.dischargeDate && patient.dischargeDate !== '-' && <div>มาแล้ว {calculateExtraDays(patient.dischargeDate)} วัน</div>}
                      </div>
                    )}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-y-1.5 gap-x-2 text-xs text-gray-600 mb-3">
                  <div>หอผู้ป่วย: <span className="font-medium text-gray-800">{patient.ward || '-'}</span></div>
                  <div>ICD10: <span className="font-medium text-gray-800">{patient.icd10 && patient.icd10 !== '-' ? patient.icd10 : '-'}</span></div>
                  <div>วันที่ให้กลับ: <span className="font-medium text-gray-800">{patient.medReadyDate || '-'}</span></div>
                  <div>ส่วนเกิน: <span className={`font-bold ${patient.extraDays >= (settings?.criticalDays||30) ? 'text-red-600' : 'text-gray-800'}`}>{patient.extraDays} วัน</span></div>
                </div>
                <div className="text-xs text-gray-600 mb-3 bg-gray-50 rounded-lg p-2 border border-gray-100">
                  <span className="font-medium text-gray-800">{patient.reason}</span>{patient.agency !== '-' ? ` → ${patient.agency}` : ''}
                </div>
                <div className="flex items-center gap-2 pt-2 border-t border-gray-100">
                  <button onClick={() => onViewHistory(patient)} className="flex-1 text-emerald-700 bg-emerald-50 border border-emerald-100 rounded-lg py-2 text-xs font-medium flex items-center justify-center gap-1"><HistoryIcon className="w-3.5 h-3.5"/> ประวัติ</button>
                  {currentUser?.role !== 'viewer' && (
                    <>
                      <button onClick={() => setSelectedPatient(patient)} className="flex-1 text-blue-700 bg-blue-50 border border-blue-100 rounded-lg py-2 text-xs font-medium flex items-center justify-center gap-1"><Edit className="w-3.5 h-3.5"/> อัปเดต</button>
                      <button onClick={() => setConfirmDeleteTarget(patient)} className="flex-1 text-red-600 bg-red-50 border border-red-100 rounded-lg py-2 text-xs font-medium flex items-center justify-center gap-1"><Trash2 className="w-3.5 h-3.5"/> ลบ</button>
                    </>
                  )}
                </div>
              </div>
            ))}
            {sortedPatients.length === 0 && <div className="text-center py-8 text-gray-400 bg-white rounded-xl border border-gray-200 border-dashed">ไม่พบข้อมูลที่ค้นหา</div>}
          </div>

          <UpdateStatusModal isOpen={!!selectedPatient} patient={selectedPatient} onClose={() => setSelectedPatient(null)} onSave={onUpdateStatus} settings={settings} />
          <ConfirmModal
            isOpen={!!confirmDeleteTarget}
            title="ยืนยันการลบข้อมูลผู้ป่วย"
            message={confirmDeleteTarget ? `ต้องการลบข้อมูลของ "${confirmDeleteTarget.name}" (HN: ${confirmDeleteTarget.hn}) ใช่หรือไม่? การลบไม่สามารถย้อนกลับได้` : ''}
            confirmLabel="ลบข้อมูล"
            danger
            onConfirm={handleConfirmDelete}
            onCancel={() => setConfirmDeleteTarget(null)}
          />
        </div>
      );
    };

    // ReportsPanel
    const ReportsPanel = ({ patients }) => {
      const [filterYear, setFilterYear] = useState('All');
      const availableYears = useMemo(() => {
        const years = new Set((patients || []).map(p => getFiscalYear(p.medReadyDate)).filter(Boolean));
        return Array.from(years).sort().reverse();
      }, [patients]);
      const filteredPatients = useMemo(() => {
        return filterYear === 'All' ? (patients || []) : (patients || []).filter(p => getFiscalYear(p.medReadyDate) === filterYear);
      }, [patients, filterYear]);

      const handleExportCSV = () => {
        const BOM = "\uFEFF";
        const headers = ['HN', 'AN', 'ชื่อ-สกุล', 'โรค (ICD10)', 'หอผู้ป่วย', 'วันที่แพทย์ให้กลับ', 'ปีงบประมาณ', 'วันส่วนเกิน', 'สาเหตุหลัก', 'ปลายทาง', 'เลขที่หนังสือส่ง', 'วันที่ส่งหนังสือ', 'หน่วยงานที่รับหนังสือ', 'สถานะหนังสือ', 'สถานะเคส', 'หน่วยงานที่ฝาก', 'วันที่ฝากหน่วยงาน', 'จำนวนวันที่ฝาก', 'สถานะการส่งต่อจริง'];
        const rows = filteredPatients.map(p => {
          const isAgency = p.status === 'Discharged To Agency';
          const dischargeDays = isAgency && p.dischargeDate && p.dischargeDate !== '-' ? calculateExtraDays(p.dischargeDate) : '';
          return [
            p.hn, p.an, p.name, p.icd10, p.ward, p.medReadyDate, getFiscalYear(p.medReadyDate), p.extraDays, p.reason, p.agency, p.letterNo, p.letterDate, p.letterAgency, p.letterStatus, statusConfig[p.status]?.label || p.status,
            isAgency && p.dischargeAgency !== '-' ? p.dischargeAgency : '',
            isAgency && p.dischargeDate !== '-' ? p.dischargeDate : '',
            dischargeDays,
            isAgency ? (dischargeFinalStatusConfig[p.dischargeFinalStatus]?.label || '') : ''
          ].map(val => `"${val || ''}"`).join(',');
        });
        const csvContent = BOM + headers.join(',') + '\n' + rows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `ผู้ป่วยจำหน่ายยาก_รายงาน_${filterYear === 'All' ? 'ทั้งหมด' : 'ปี_'+filterYear}_${new Date().toISOString().split('T')[0]}.csv`;
        link.click();
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div className="flex justify-between items-center mb-6"><h2 className="text-2xl font-bold text-gray-800">ออกรายงาน (Reports)</h2></div>
          <div className="bg-white p-10 rounded-xl shadow-sm border border-gray-200 text-center flex flex-col items-center justify-center space-y-5">
            <div className="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center border-4 border-emerald-100"><FileSpreadsheet className="w-10 h-10" /></div>
            <div>
              <h3 className="font-bold text-xl text-gray-800">ส่งออกข้อมูลเป็นไฟล์ Excel (CSV)</h3>
              <p className="text-gray-500 text-sm mt-2">ดาวน์โหลดข้อมูลผู้ป่วยตามปีงบประมาณที่คุณต้องการ</p>
            </div>
            <div className="flex flex-col sm:flex-row items-center gap-3 mt-6 bg-gray-50 p-4 rounded-xl border border-gray-100 w-full max-w-md">
              <select className="border border-gray-300 rounded-lg text-sm px-4 py-2.5 outline-none focus:ring-2 focus:ring-emerald-500 bg-white w-full sm:flex-1 shadow-sm" value={filterYear} onChange={(e) => setFilterYear(e.target.value)}>
                <option value="All">ดึงข้อมูลทุกปีงบประมาณ</option>
                {availableYears.map(y => <option key={y} value={y}>เฉพาะปีงบประมาณ {y}</option>)}
              </select>
              <button onClick={handleExportCSV} className="flex items-center justify-center gap-2 bg-emerald-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-emerald-700 transition w-full sm:w-auto shadow-sm hover:shadow-md">
                <Download className="w-5 h-5" /> ดาวน์โหลด ({filteredPatients.length} รายการ)
              </button>
            </div>
          </div>
        </div>
      );
    };

    // SettingsPanel
    const SettingsPanel = ({ settings, onSaveSettings, currentUser, token, pushToast, onAuthError }) => {
      const [localSettings, setLocalSettings] = useState({ criticalDays: settings?.criticalDays || 30, wards: settings?.wards || [], agencies: settings?.agencies || [] });
      const [isSaving, setIsSaving] = useState(false);
      const [newWard, setNewWard] = useState('');
      const [newAgency, setNewAgency] = useState('');

      const [users, setUsers] = useState([]);
      const [newUser, setNewUser] = useState({ username: '', password: '', role: 'user' });
      const [confirmDeleteUser, setConfirmDeleteUser] = useState(null);

      useEffect(() => {
        if (currentUser?.role === 'admin') {
          apiGet('getAllUsers', { token }).then((res) => {
            if (res.success) setUsers(res.data || []);
            else if (!(onAuthError && onAuthError(res))) pushToast && pushToast(res.message || 'โหลดรายชื่อผู้ใช้งานไม่สำเร็จ', 'error');
          }).catch(() => pushToast && pushToast('โหลดรายชื่อผู้ใช้งานไม่สำเร็จ (เชื่อมต่อ API ไม่ได้)', 'error'));
        }
      }, [currentUser, token]);

      const handleSave = async () => {
        setIsSaving(true);
        await onSaveSettings(localSettings);
        setIsSaving(false);
      };

      const addItem = (key, value, setter) => {
        if (!value.trim()) return;
        setLocalSettings(prev => ({ ...prev, [key]: [...(prev[key] || []), value.trim()] }));
        setter('');
      };
      const removeItem = (key, index) => {
        setLocalSettings(prev => { const newArray = [...(prev[key] || [])]; newArray.splice(index, 1); return { ...prev, [key]: newArray }; });
      };
      const renameItem = (key, index, value) => {
        setLocalSettings(prev => { const newArray = [...(prev[key] || [])]; newArray[index] = value; return { ...prev, [key]: newArray }; });
      };

      const handleAddUser = async (e) => {
        e.preventDefault();
        if (!newUser.username || newUser.password.length < 6) { pushToast && pushToast('กรอกข้อมูลไม่ครบ หรือรหัสผ่านสั้นเกินไป (อย่างน้อย 6 ตัว)', 'error'); return; }
        try {
          const res = await apiPost('addNewUserAccount', { username: newUser.username, password: newUser.password, role: newUser.role, token });
          if (res.success) { setUsers(res.users); setNewUser({ username: '', password: '', role: 'user' }); pushToast && pushToast('เพิ่มบัญชีผู้ใช้งานเรียบร้อย', 'success'); }
          else if (!(onAuthError && onAuthError(res))) pushToast && pushToast(res.message, 'error');
        } catch (err) {
          pushToast && pushToast('เพิ่มบัญชีไม่สำเร็จ (เชื่อมต่อ API ไม่ได้)', 'error');
        }
      };

      const handleDeleteUser = async () => {
        if (!confirmDeleteUser) return;
        try {
          const res = await apiPost('deleteUserAccount', { id: confirmDeleteUser.id, token });
          if (res.success) { setUsers(res.users); pushToast && pushToast('ลบบัญชีผู้ใช้งานเรียบร้อย', 'success'); }
          else if (!(onAuthError && onAuthError(res))) pushToast && pushToast(res.message, 'error');
        } catch (err) {
          pushToast && pushToast('ลบบัญชีไม่สำเร็จ (เชื่อมต่อ API ไม่ได้)', 'error');
        }
        setConfirmDeleteUser(null);
      };

      const isAdmin = currentUser?.role === 'admin';

      return (
        <div className="space-y-6 max-w-4xl pb-10">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-bold text-gray-800">การตั้งค่าระบบ (Settings)</h2>
            <button onClick={handleSave} disabled={isSaving} className="flex items-center gap-2 bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm transition-shadow disabled:opacity-60"><Save className="w-4 h-4" /> {isSaving ? 'กำลังบันทึก...' : 'บันทึกการตั้งค่า'}</button>
          </div>

          {isAdmin && (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
              <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-gray-800"><Users className="w-5 h-5 text-blue-600" /> ระบบจัดการบัญชีผู้ใช้งาน (เฉพาะผู้ดูแลระบบ)</h3>

              <form onSubmit={handleAddUser} className="flex flex-col sm:flex-row gap-3 mb-5 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                <input type="text" required placeholder="Username ใหม่" className="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" value={newUser.username} onChange={e => setNewUser({...newUser, username: e.target.value})} />
                <input type="password" required placeholder="Password (6 ตัวขึ้นไป)" className="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" value={newUser.password} onChange={e => setNewUser({...newUser, password: e.target.value})} />
                <select className="border border-gray-300 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm" value={newUser.role} onChange={e => setNewUser({...newUser, role: e.target.value})}>
                  <option value="user">ผู้ใช้งานทั่วไป (User)</option>
                  <option value="viewer">ผู้เยี่ยมชม (Viewer - ดูข้อมูลเท่านั้น)</option>
                  <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                </select>
                <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm transition-colors whitespace-nowrap">เพิ่มบัญชี</button>
              </form>

              <div className="border border-gray-200 rounded-lg overflow-hidden">
                <table className="w-full text-left text-sm text-gray-600">
                  <thead className="bg-gray-50 text-gray-700 border-b border-gray-200">
                    <tr><th className="px-4 py-3 font-semibold">Username</th><th className="px-4 py-3 font-semibold">สิทธิ์การใช้งาน (Role)</th><th className="px-4 py-3 font-semibold text-center w-24">ลบ</th></tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {users.map(u => (
                      <tr key={u.id} className="hover:bg-gray-50">
                        <td className="px-4 py-3 font-semibold text-gray-800">{u.username}</td>
                        <td className="px-4 py-3">
                          <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${u.role === 'admin' ? 'bg-purple-100 text-purple-700 border-purple-200' : u.role === 'viewer' ? 'bg-green-100 text-green-700 border-green-200' : 'bg-slate-100 text-slate-700 border-slate-200'}`}>
                            {u.role === 'admin' ? 'ผู้ดูแลระบบ' : u.role === 'viewer' ? 'ผู้เยี่ยมชม (Viewer)' : 'ผู้ใช้งานทั่วไป'}
                          </span>
                        </td>
                        <td className="px-4 py-3 text-center">
                          {u.username !== currentUser?.username && (
                            <button onClick={() => setConfirmDeleteUser(u)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-1.5 rounded-md transition-colors border border-red-100"><Trash2 className="w-4 h-4"/></button>
                          )}
                        </td>
                      </tr>
                    ))}
                    {users.length === 0 && <tr><td colSpan="3" className="px-4 py-6 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative overflow-hidden">
              <div className="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
              <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-gray-800"><AlertCircle className="w-5 h-5 text-red-500" /> ตั้งค่าตัวชี้วัด (KPI)</h3>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">จำนวนวันส่วนเกินที่ถือเป็น "เคสวิกฤต"</label>
                <div className="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border border-gray-100">
                  <input type="number" min="1" value={localSettings.criticalDays} onChange={(e) => setLocalSettings({...localSettings, criticalDays: e.target.value})} className="w-24 border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-center font-bold text-gray-800" />
                  <span className="text-sm text-gray-600 font-medium">วันขึ้นไป</span>
                </div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <h3 className="font-bold text-lg mb-4 text-gray-800">จัดการตัวเลือก: หอผู้ป่วย</h3>
              <div className="flex gap-2 mb-4">
                <input type="text" value={newWard} onChange={(e) => setNewWard(e.target.value)} placeholder="เพิ่มหอผู้ป่วย..." className="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
                <button onClick={() => addItem('wards', newWard, setNewWard)} className="bg-gray-100 px-4 py-2 rounded-lg border border-gray-200 text-sm font-medium hover:bg-gray-200 transition-colors">เพิ่ม</button>
              </div>
              <ul className="space-y-2 max-h-48 overflow-y-auto pr-2">
                {(localSettings.wards || []).map((ward, idx) => (
                  <li key={idx} className="flex items-center gap-2 text-sm bg-gray-50 px-2 py-1 rounded-lg border border-gray-100">
                    <input value={ward} onChange={e => renameItem('wards', idx, e.target.value)} className="flex-1 bg-transparent outline-none font-medium text-gray-700 px-2 py-1.5 rounded focus:bg-white focus:ring-2 focus:ring-blue-400 transition-shadow" />
                    <button onClick={() => removeItem('wards', idx)} className="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-1 rounded transition-colors flex-shrink-0"><X className="w-4 h-4"/></button>
                  </li>
                ))}
              </ul>
            </div>

            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-200 md:col-span-2">
              <h3 className="font-bold text-lg mb-4 text-gray-800">จัดการตัวเลือก: หน่วยงานปลายทาง</h3>
              <div className="flex gap-2 mb-4 max-w-md">
                <input type="text" value={newAgency} onChange={(e) => setNewAgency(e.target.value)} placeholder="เพิ่มหน่วยงาน..." className="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
                <button onClick={() => addItem('agencies', newAgency, setNewAgency)} className="bg-gray-100 px-4 py-2 rounded-lg border border-gray-200 text-sm font-medium hover:bg-gray-200 transition-colors">เพิ่ม</button>
              </div>
              <ul className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-48 overflow-y-auto pr-2">
                {(localSettings.agencies || []).map((agency, idx) => (
                  <li key={idx} className="flex items-center gap-2 text-sm bg-gray-50 px-2 py-1 rounded-lg border border-gray-100">
                    <input value={agency} onChange={e => renameItem('agencies', idx, e.target.value)} className="flex-1 bg-transparent outline-none font-medium text-gray-700 px-2 py-1.5 rounded focus:bg-white focus:ring-2 focus:ring-blue-400 transition-shadow" />
                    <button onClick={() => removeItem('agencies', idx)} className="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-1 rounded transition-colors flex-shrink-0"><X className="w-4 h-4"/></button>
                  </li>
                ))}
              </ul>
            </div>
          </div>

          <ConfirmModal
            isOpen={!!confirmDeleteUser}
            title="ยืนยันการลบบัญชีผู้ใช้งาน"
            message={confirmDeleteUser ? `ต้องการลบบัญชี "${confirmDeleteUser.username}" ใช่หรือไม่?` : ''}
            confirmLabel="ลบบัญชี"
            danger
            onConfirm={handleDeleteUser}
            onCancel={() => setConfirmDeleteUser(null)}
          />
        </div>
      );
    };

    // --- Main App ---
    const App = () => {
      const [currentUser, setCurrentUser] = useState(null);
      const [token, setToken] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [isPwdModalOpen, setIsPwdModalOpen] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);

      const [historyPatient, setHistoryPatient] = useState(null);

      const [patients, setPatients] = useState([]);
      const [settings, setSettings] = useState({ criticalDays: 30, wards: [], agencies: [] });
      const [isInitializing, setIsInitializing] = useState(false);

      const [toasts, setToasts] = useState([]);
      const pushToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };
      const dismissToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      useEffect(() => {
        const handleResize = () => {
          if (window.innerWidth < 768) {
            setIsSidebarOpen(false);
          } else {
            setIsSidebarOpen(true);
          }
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const handleLogout = () => {
        if (token) { apiPost('logout', { token }).catch(() => {}); }
        setCurrentUser(null);
        setToken(null);
        setActiveTab('dashboard');
      };

      // จัดการ error จากการเชื่อมต่อ API แบบรวมศูนย์:
      // - เซสชันหมดอายุ -> ล็อกเอาท์อัตโนมัติ + toast
      // - ไม่มีสิทธิ์ -> toast แจ้งเตือน
      // คืนค่า true ถ้าได้จัดการ error ไปแล้ว (ผู้เรียกจะได้ไม่ต้อง toast ซ้ำ)
      const maybeHandleAuthError = (res) => {
        if (res && res.code === 'SESSION_EXPIRED') {
          pushToast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่อีกครั้ง', 'error');
          handleLogout();
          return true;
        }
        if (res && res.code === 'FORBIDDEN') {
          pushToast('คุณไม่มีสิทธิ์ทำรายการนี้', 'error');
          return true;
        }
        return false;
      };

      // สำหรับ error ที่เป็น exception จริงๆ (fetch ล้มเหลว, เชื่อมต่อ API ไม่ได้ ฯลฯ)
      const networkFailureToast = (err, fallbackMsg) => {
        console.error(err);
        pushToast(fallbackMsg || 'การเชื่อมต่อ API ล้มเหลว โปรดตรวจสอบอินเทอร์เน็ตหรือ API_URL', 'error');
      };

      const loadData = async () => {
        setIsInitializing(true);
        try {
          const [patientsRes, settingsRes] = await Promise.all([
            apiGet('getPatients', { token }),
            apiGet('getSettings', { token })
          ]);

          if (patientsRes.success) {
            setPatients((patientsRes.data || []).map(p => ({ ...p, extraDays: calculateExtraDays(p.medReadyDate) })));
          } else if (!maybeHandleAuthError(patientsRes)) {
            pushToast(patientsRes.message || 'โหลดข้อมูลผู้ป่วยล้มเหลว', 'error');
          }

          if (settingsRes.success) {
            setSettings(settingsRes.data || { criticalDays: 30, wards: [], agencies: [] });
          } else if (!maybeHandleAuthError(settingsRes)) {
            pushToast(settingsRes.message || 'โหลดการตั้งค่าล้มเหลว', 'error');
          }
        } catch (err) {
          networkFailureToast(err, 'เชื่อมต่อ API ไม่สำเร็จ โปรดตรวจสอบ API_URL หรืออินเทอร์เน็ต');
        } finally {
          setIsInitializing(false);
        }
      };

      const handleLogin = (userObj, tok) => {
        setIsInitializing(true);
        setToken(tok);
        setCurrentUser(userObj);
      };

      useEffect(() => {
        if (currentUser && token) { loadData(); }
      }, [currentUser, token]);

      const handleSavePatient = async (data) => {
        try {
          const res = await apiPost('addPatient', { patient: data, token });
          if (res.success) { loadData(); pushToast('บันทึกข้อมูลผู้ป่วยเรียบร้อย', 'success'); }
          else { maybeHandleAuthError(res); }
          return res;
        } catch (err) {
          networkFailureToast(err, 'บันทึกข้อมูลไม่สำเร็จ');
          return { success: false, message: 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง' };
        }
      };

      const handleDeletePatient = async (id) => {
        try {
          const res = await apiPost('deletePatient', { id, token });
          if (res.success) { loadData(); pushToast('ลบข้อมูลผู้ป่วยเรียบร้อย', 'success'); }
          else if (!maybeHandleAuthError(res)) { pushToast((res && res.message) || 'ลบข้อมูลไม่สำเร็จ', 'error'); }
        } catch (err) {
          networkFailureToast(err, 'ลบข้อมูลไม่สำเร็จ');
        }
      };

      const handleUpdatePatientStatus = async (id, newStatus, note, letterNo, letterDate, letterAgency, letterStatus, icd10, dischargeAgency, dischargeDate, dischargeFinalStatus) => {
        try {
          const res = await apiPost('updatePatientStatus', { patientId: id, newStatus, note, letterNo, letterDate, letterAgency, letterStatus, icd10, dischargeAgency, dischargeDate, dischargeFinalStatus, token });
          if (res.success) { loadData(); pushToast('อัปเดตสถานะเรียบร้อย', 'success'); }
          else { maybeHandleAuthError(res); }
          return res;
        } catch (err) {
          networkFailureToast(err, 'อัปเดตสถานะไม่สำเร็จ');
          return { success: false, message: 'เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง' };
        }
      };

      const handleSaveSettings = async (newSetts) => {
        try {
          const res = await apiPost('saveSettings', { settings: newSetts, token });
          if (res.success) { setSettings(res.data); pushToast('บันทึกการตั้งค่าเรียบร้อย', 'success'); return { success: true }; }
          if (!maybeHandleAuthError(res)) pushToast(res.message || 'บันทึกการตั้งค่าไม่สำเร็จ', 'error');
          return { success: false };
        } catch (err) {
          networkFailureToast(err, 'บันทึกการตั้งค่าไม่สำเร็จ');
          return { success: false };
        }
      };

      if (!currentUser) return (
        <>
          <LoginScreen onLogin={handleLogin} />
          <ToastContainer toasts={toasts} onDismiss={dismissToast} />
        </>
      );

      if (isInitializing) return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
          <div className="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
          <div className="text-gray-500 font-medium">กำลังโหลดข้อมูลระบบ...</div>
        </div>
      );

      const NavButton = ({ tabId, icon: IconComponent, label }) => (
        <button onClick={() => { setActiveTab(tabId); if (window.innerWidth < 768) setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-6 py-3.5 text-sm font-medium transition-colors ${activeTab === tabId ? 'bg-slate-800 text-white border-l-4 border-blue-500' : 'hover:bg-slate-800 hover:text-white border-l-4 border-transparent text-slate-300'}`}>
          <IconComponent className="w-5 h-5 flex-shrink-0" />
          <span className="truncate whitespace-nowrap">{label}</span>
        </button>
      );

      return (
        <div className="min-h-screen bg-gray-50 flex font-sans text-gray-900 overflow-x-hidden">

          {isSidebarOpen && (
            <div
              className="fixed inset-0 bg-black/50 z-20 md:hidden transition-opacity"
              onClick={() => setIsSidebarOpen(false)}
            ></div>
          )}

          <aside className={`bg-slate-900 text-slate-300 flex-shrink-0 h-screen fixed md:sticky top-0 left-0 shadow-xl z-30 transition-all duration-300 ${isSidebarOpen ? 'w-64 translate-x-0' : 'w-64 -translate-x-full md:w-0 md:translate-x-0 overflow-hidden'}`}>
            <div className="w-64 h-full flex flex-col w-full">
              <div className="p-6 border-b border-slate-800/80">
                <div className="flex items-center gap-3 text-white font-bold text-xl tracking-wide">
                  <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20 p-1.5 flex-shrink-0">
                    <img src={LOGO_URL} alt="โลโก้กลุ่มงานสังคมสงเคราะห์" className="w-full h-full object-contain" />
                  </div>
                  D-Discharge
                </div>
                <div className="text-xs text-slate-400 mt-2 font-medium tracking-wider uppercase opacity-80 text-center">กลุ่มงานสังคมสงเคราะห์ • Patient Tracking System</div>
              </div>
              <nav className="flex-1 py-6 space-y-1 overflow-y-auto">
                <NavButton tabId="dashboard" icon={LayoutDashboard} label="แดชบอร์ดภาพรวม" />
                <NavButton tabId="patients" icon={Users} label="ทะเบียนผู้ป่วย" />
                <NavButton tabId="reports" icon={FileSpreadsheet} label="ออกรายงาน (Export)" />
                <NavButton tabId="settings" icon={Settings} label="การตั้งค่าระบบ" />
              </nav>
              <div className="p-5 border-t border-slate-800/80 bg-slate-950/30">
                <div className="flex items-center gap-3 mb-4">
                  <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-bold text-white text-sm uppercase shadow-inner">{String(currentUser?.username || 'U').substring(0,2)}</div>
                  <div className="flex-1 overflow-hidden">
                    <div className="text-sm font-bold text-white truncate">{currentUser.username}</div>
                    <div className="text-xs text-emerald-400 font-medium capitalize mt-0.5">
                      {currentUser.role === 'admin' ? 'Administrator' : currentUser.role === 'viewer' ? 'Viewer' : 'User'}
                    </div>
                  </div>
                </div>
                <div className="space-y-2">
                  <button onClick={() => setIsPwdModalOpen(true)} className="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs font-medium rounded-lg text-slate-300 hover:text-white hover:bg-slate-800 border border-transparent hover:border-slate-700 transition-all"><Lock className="w-3.5 h-3.5" />เปลี่ยนรหัสผ่าน</button>
                  <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs font-medium rounded-lg text-red-400 hover:text-white hover:bg-red-500/20 border border-transparent hover:border-red-500/30 transition-all"><LogOut className="w-3.5 h-3.5" />ออกจากระบบ</button>
                </div>
              </div>
            </div>
          </aside>

          <main className="flex-1 flex flex-col min-h-screen max-w-full overflow-hidden transition-all duration-300">
            <header className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10 px-6 py-4 flex justify-between items-center">
              <div className="flex items-center gap-4">
                <button
                  onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                  className="text-gray-500 hover:bg-gray-100 p-2 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                  aria-label="Toggle Menu"
                >
                  <MenuIcon className="w-6 h-6" />
                </button>
                <div className="flex items-center gap-2 md:hidden">
                  <img src={LOGO_URL} alt="โลโก้กลุ่มงานสังคมสงเคราะห์" className="w-7 h-7 object-contain flex-shrink-0" />
                  <span className="font-bold text-lg">D-Discharge</span>
                </div>
                <div className="hidden md:block">
                  <h1 className="text-xl font-bold text-gray-800">
                    {activeTab === 'dashboard' && 'แดชบอร์ดภาพรวมระบบ'}
                    {activeTab === 'patients' && 'ทะเบียนประวัติผู้ป่วยจำหน่ายยาก'}
                    {activeTab === 'reports' && 'ระบบออกรายงาน (Export Data)'}
                    {activeTab === 'settings' && 'การตั้งค่าระบบ (Settings)'}
                  </h1>
                </div>
              </div>
              <div className="flex items-center gap-4">
                {currentUser?.role !== 'viewer' && (
                  <button onClick={() => setIsModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 md:px-5 md:py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm hover:shadow transition-all"><Plus className="w-4 h-4" /><span className="hidden sm:inline">แจ้งเคสใหม่ (Refer)</span></button>
                )}
              </div>
            </header>
            <div className="flex-1 p-4 md:p-6 lg:p-8 overflow-y-auto w-full">
              <div className="max-w-7xl mx-auto w-full">
                {activeTab === 'dashboard' && <Dashboard patients={patients} settings={settings} />}
                {activeTab === 'patients' && <PatientList patients={patients} onDelete={handleDeletePatient} onUpdateStatus={handleUpdatePatientStatus} onViewHistory={setHistoryPatient} settings={settings} currentUser={currentUser} />}
                {activeTab === 'reports' && <ReportsPanel patients={patients} />}
                {activeTab === 'settings' && <SettingsPanel settings={settings} onSaveSettings={handleSaveSettings} currentUser={currentUser} token={token} pushToast={pushToast} onAuthError={maybeHandleAuthError} />}
              </div>
            </div>
          </main>

          <AddPatientModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={handleSavePatient} settings={settings} />
          <ChangePasswordModal isOpen={isPwdModalOpen} onClose={() => setIsPwdModalOpen(false)} username={currentUser.username} token={token} onAuthError={maybeHandleAuthError} />
          <ViewHistoryModal isOpen={!!historyPatient} onClose={() => setHistoryPatient(null)} patient={historyPatient} token={token} onAuthError={maybeHandleAuthError} />
          <ToastContainer toasts={toasts} onDismiss={dismissToast} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
