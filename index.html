<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการผู้ป่วยจำหน่ายยาก</title><link rel="icon" type="image/png" href="https://i.ibb.co/C5sD85wd/Logo-sw69.png">

  <link rel="icon" type="image/png" href="https://i.ibb.co/C5sD85wd/Logo-sw69.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sarabun', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.22.20/babel.min.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <script>
    // หมายเหตุ: หน้านี้ตั้งใจเปิดให้ฝังใน iframe ได้ (เช่นบน GitHub Pages) จึงแสดงข้อความ error
    // แบบสุภาพ ไม่โชว์ stack trace เต็มให้ผู้ใช้ทั่วไปเห็นตรงๆ (ดูรายละเอียดได้ผ่านปุ่ม "รายละเอียดทางเทคนิค")
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML =
        '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8FAFC;font-family:\'Sarabun\',sans-serif;padding:24px;">' +
          '<div style="max-width:480px;width:100%;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:32px;text-align:center;box-shadow:0 10px 30px rgba(15,23,42,0.08);">' +
            '<div style="width:56px;height:56px;border-radius:9999px;background:#FEF2F2;color:#DC2626;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;">⚠️</div>' +
            '<h1 style="color:#0F172A;font-size:19px;font-weight:700;margin-bottom:8px;">ขออภัย ระบบเกิดข้อผิดพลาด</h1>' +
            '<p style="color:#64748B;font-size:14px;margin-bottom:20px;">กรุณาลองโหลดหน้าเว็บใหม่อีกครั้ง หากยังพบปัญหา กรุณาแจ้งผู้ดูแลระบบ</p>' +
            '<button onclick="window.location.reload()" style="padding:10px 24px;background:#2563EB;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:500;font-family:inherit;font-size:14px;">รีโหลดหน้าเว็บ</button>' +
            '<details style="margin-top:20px;text-align:left;">' +
              '<summary style="cursor:pointer;font-size:12px;color:#94A3B8;">รายละเอียดทางเทคนิค</summary>' +
              '<pre style="margin-top:10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px;font-size:11px;color:#475569;overflow:auto;max-height:200px;white-space:pre-wrap;">' + message + '\nline ' + lineno + ':' + colno + '\n' + (error ? error.stack : '') + '</pre>' +
            '</details>' +
          '</div>' +
        '</div>';
      return true;
    };
  </script>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-50 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel" data-presets="react,env" data-type="text/javascript">
    const { useState, useEffect, useMemo, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null, errorInfo: null };
      }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error, errorInfo) {
        console.error("React Error:", error, errorInfo);
        this.setState({ errorInfo });
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 text-center">
              <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mb-4">
                <svg className="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </div>
              <h1 className="text-xl font-bold text-gray-800 mb-2">ขออภัย เกิดข้อผิดพลาดในการแสดงผล</h1>
              <p className="text-sm text-gray-500 mb-4 max-w-sm">กรุณาลองโหลดหน้าเว็บใหม่อีกครั้ง หากยังพบปัญหาให้แจ้งผู้ดูแลระบบ</p>
              <button onClick={() => window.location.reload()} className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition-colors mb-4">โหลดหน้าเว็บใหม่</button>
              <details className="text-left w-full max-w-lg">
                <summary className="cursor-pointer text-xs text-gray-400">รายละเอียดทางเทคนิค</summary>
                <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200 text-left w-full overflow-auto text-xs text-gray-600 font-mono mt-2 max-h-48">
                  <p className="font-bold text-red-600 mb-2">{this.state.error && this.state.error.toString()}</p>
                  <pre className="text-xs text-gray-500 whitespace-pre-wrap">{this.state.errorInfo && this.state.errorInfo.componentStack}</pre>
                </div>
              </details>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- API Client ---
    // ระบบนี้ไม่ได้รันอยู่บน Apps Script อีกต่อไป (โฮสต์บน GitHub Pages) จึงเรียกข้อมูลผ่าน fetch()
    // ไปยัง Apps Script Web App ที่ deploy เป็น JSON API (ดู Code.gs)
    //
    // *** สำคัญ: แก้ URL ด้านล่างเป็น Web App URL จริงที่ได้จากการ Deploy > New deployment ***
    // ต้องลงท้ายด้วย /exec เช่น https://script.google.com/macros/s/AKfycb.../exec
    const API_URL = 'https://script.google.com/macros/s/AKfycbz2lijSaB-MEKSvJtR_qIKlx9kyEPjK14M6VB5HdzEhl1NxkZzZ4exuCBMKOpEJyibVXg/exec';

    async function apiGet(action, params = {}) {
      const qs = new URLSearchParams({ action, ...params }).toString();
      let res;
      try {
        res = await fetch(`${API_URL}?${qs}`, { method: 'GET' });
      } catch (err) {
        throw new Error('NETWORK_ERROR');
      }
      if (!res.ok) throw new Error('NETWORK_ERROR');
      try {
        return await res.json();
      } catch (err) {
        throw new Error('INVALID_RESPONSE');
      }
    }

    // ใช้ Content-Type: text/plain โดยตั้งใจ — เพื่อให้ browser มองว่าเป็น "simple request"
    // และไม่ยิง CORS preflight (OPTIONS) ออกไปก่อน เพราะ Apps Script ตอบ preflight ไม่ได้อย่างถูกต้อง
    // ฝั่ง Code.gs จะ JSON.parse ข้อความดิบเอาเอง ไม่ได้สนใจ Content-Type ที่ระบุมา
    async function apiPost(action, payload = {}) {
      let res;
      try {
        res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, ...payload })
        });
      } catch (err) {
        throw new Error('NETWORK_ERROR');
      }
      if (!res.ok) throw new Error('NETWORK_ERROR');
      try {
        return await res.json();
      } catch (err) {
        throw new Error('INVALID_RESPONSE');
      }
    }

    // --- Icons ---
    const Icon = ({ children, className }) => <svg className={className || "w-5 h-5"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
    const LayoutDashboard = (p) => <Icon {...p}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></Icon>;
    const Users = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const Building2 = (p) => <Icon {...p}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></Icon>;
    const Settings = (p) => <Icon {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></Icon>;
    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
    const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
    const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
    const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
    const Save = (p) => <Icon {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Icon>;
    const Mail = (p) => <Icon {...p}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></Icon>;
    const Edit = (p) => <Icon {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>;
    const FileSpreadsheet = (p) => <Icon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></Icon>;
    const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
    const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
    const HistoryIcon = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></Icon>;
    const Stethoscope = (p) => <Icon {...p}><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></Icon>;
    const MenuIcon = (p) => <Icon {...p}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></Icon>;

    // --- Helpers ---
    const LOGO_URL = 'https://i.ibb.co/C5sD85wd/Logo-sw69.png';

    const statusConfig = {
      'New Case': { label: 'เคสใหม่ (รอประเมิน)', color: 'bg-gray-100 text-gray-700 border-gray-300' },
      'Assessment': { label: 'กำลังประเมิน/ค้นหาญาติ', color: 'bg-blue-100 text-blue-700 border-blue-300' },
      'Document Preparation': { label: 'เตรียมเอกสาร/ทำบัตร', color: 'bg-yellow-100 text-yellow-700 border-yellow-300' },
      'Letter Sent': { label: 'ส่งหนังสือราชการแล้ว', color: 'bg-purple-100 text-purple-700 border-purple-300' },
      'Awaiting Agency': { label: 'รอคิวสถานสงเคราะห์', color: 'bg-orange-100 text-orange-700 border-orange-300' },
      'Ready for Transfer': { label: 'ได้คิวแล้ว (รอส่งตัว)', color: 'bg-green-100 text-green-700 border-green-300' },
      'Discharged To Agency': { label: 'จำหน่ายออกจากรพ. ฝากหน่วยงานอื่น', color: 'bg-cyan-100 text-cyan-700 border-cyan-300' },
      'Discharged': { label: 'จำหน่ายสำเร็จ', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
    };

    // สถานะย่อยของการติดตามผู้ป่วยที่ "จำหน่ายออกจากรพ. ฝากหน่วยงานอื่น" — ใช้คู่กับ dischargeAgency / dischargeDate
    const dischargeFinalStatusConfig = {
      'pending': { label: 'รอส่งตัวจริงไปสถานสงเคราะห์', color: 'bg-orange-100 text-orange-700 border-orange-300' },
      'confirmed': { label: 'ส่งตัวจริงสำเร็จแล้ว (ยืนยันรับแล้ว)', color: 'bg-emerald-100 text-emerald-700 border-emerald-300' },
      'rejected': { label: 'ส่งตัวไม่สำเร็จ / ถูกปฏิเสธ', color: 'bg-red-100 text-red-700 border-red-300' },
    };

    // สถานะที่ถือว่า "ปิดเคส" แล้ว (ไม่นับรวมในสถิติเตียง/เคสที่กำลังดำเนินการของแดชบอร์ด) เหมือนสถานะจำหน่ายสำเร็จ
    const TERMINAL_STATUSES = ['Discharged', 'Discharged To Agency'];

    // รายการอ้างอิง ICD10 เบื้องต้นสำหรับผู้ป่วยจำหน่ายยาก (ไม่ครบทุกรหัส เป็นเพียงตัวช่วยกรอกให้สม่ำเสมอ — ยังพิมพ์ค่าอื่นได้อิสระ)
    const ICD10_SUGGESTIONS = [
      ['I63', 'อัมพาตจากหลอดเลือดสมองตีบ'], ['I61', 'เลือดออกในสมอง'], ['I69', 'ภาวะหลังโรคหลอดเลือดสมอง'],
      ['G81', 'อัมพาตครึ่งซีก'], ['G80', 'สมองพิการแต่กำเนิด'], ['F03', 'ภาวะสมองเสื่อมไม่ระบุชนิด'],
      ['F70', 'ภาวะบกพร่องทางสติปัญญา'], ['F20', 'โรคจิตเภท'], ['F32', 'ภาวะซึมเศร้า'], ['Q90', 'กลุ่มอาการดาวน์'],
      ['E10', 'เบาหวานชนิดที่ 1'], ['E11', 'เบาหวานชนิดที่ 2'], ['I10', 'ความดันโลหิตสูง'], ['I50', 'หัวใจล้มเหลว'],
      ['N18', 'ไตวายเรื้อรัง'], ['J18', 'ปอดอักเสบ'], ['J96', 'ภาวะหายใจล้มเหลว'], ['A41', 'ภาวะติดเชื้อในกระแสเลือด'],
      ['S72', 'กระดูกต้นขาหัก'], ['M80', 'กระดูกพรุนร่วมกับกระดูกหัก'], ['L89', 'แผลกดทับ'], ['B20', 'ภาวะติดเชื้อเอชไอวี'],
      ['R54', 'ภาวะชราภาพ'], ['Z74', 'ภาวะพึ่งพิงต้องมีผู้ดูแล'], ['T14', 'บาดเจ็บไม่ระบุตำแหน่งชัดเจน'],
    ];

    const Icd10Datalist = ({ id }) => (
      <datalist id={id}>
        {ICD10_SUGGESTIONS.map(([code, label]) => <option key={code} value={code} label={label} />)}
      </datalist>
    );

    const calculateExtraDays = (medReadyDateStr) => {
      if (!medReadyDateStr) return 0;
      const medDate = new Date(medReadyDateStr);
      if (isNaN(medDate.getTime())) return 0;
      const diffTime = new Date().getTime() - medDate.getTime();
      if (diffTime <= 0) return 0;
      return Math.floor(diffTime / (1000 * 60 * 60 * 24));
    };

    const getFiscalYear = (dateStr) => {
      if (!dateStr) return null;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return null;
      let fy = d.getFullYear() + 543;
      if (d.getMonth() >= 9) fy += 1;
      return fy.toString();
    };

    const formatDateTime = (isoString) => {
      if(!isoString) return '-';
      const d = new Date(isoString);
      if(isNaN(d.getTime())) return '-';
      return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' น.';
    };

    const StatusBadge = ({ status }) => {
      const config = statusConfig[status] || { label: status || 'Unknown', color: 'bg-gray-100 text-gray-700 border-gray-300' };
      return <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${config.color} whitespace-nowrap`}>{config.label}</span>;
    };

    // --- Toasts ---
    const Toast = ({ toast, onDismiss }) => {
      const styles = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-slate-800' };
      return (
        <div className={`${styles[toast.type] || styles.info} text-white px-4 py-3 rounded-lg shadow-lg flex items-center justify-between gap-3 min-w-[260px] max-w-sm animate-fade-in`}>
          <span className="text-sm font-medium">{toast.message}</span>
          <button onClick={() => onDismiss(toast.id)} className="text-white/70 hover:text-white flex-shrink-0"><X className="w-4 h-4"/></button>
        </div>
      );
    };
    const ToastContainer = ({ toasts, onDismiss }) => (
      <div className="fixed top-4 right-4 z-[100] space-y-2 w-full max-w-sm px-4 sm:px-0">
        {toasts.map(t => <Toast key={t.id} toast={t} onDismiss={onDismiss} />)}
      </div>
    );

    // --- Confirm Modal (ใช้แทน window.confirm ให้ดีไซน์เข้าชุดกันทั้งระบบ) ---
    const ConfirmModal = ({ isOpen, title, message, confirmLabel, danger, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in">
            <div className="p-6">
              <div className={`w-12 h-12 rounded-full flex items-center justify-center mb-4 ${danger ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}><AlertCircle className="w-6 h-6"/></div>
              <h3 className="text-lg font-bold text-gray-800 mb-2">{title}</h3>
              <p className="text-sm text-gray-600 leading-relaxed">{message}</p>
            </div>
            <div className="px-6 py-4 bg-gray-50 border-t border-gray-100 flex justify-end gap-3">
              <button onClick={onCancel} className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium bg-white hover:bg-gray-100 transition-colors">ยกเลิก</button>
              <button onClick={onConfirm} className={`px-4 py-2 rounded-lg text-sm font-medium text-white transition-colors shadow-sm ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}>{confirmLabel || 'ยืนยัน'}</button>
            </div>
          </div>
        </div>
      );
    };

    // --- Components ---

    // 1. Login Screen
    const LoginScreen = ({ onLogin }) => {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          const res = await apiPost('login', { username, password });
          if (res.success) { onLogin(res.user, res.token); }
          else { setError(res.message || 'เข้าสู่ระบบไม่สำเร็จ'); setLoading(false); }
        } catch (err) {
          setError('การเชื่อมต่อ API ล้มเหลว โปรดตรวจสอบอินเทอร์เน็ตหรือแจ้งผู้ดูแลระบบ');
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white max-w-md w-full rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div className="bg-slate-900 px-8 py-10 text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-emerald-400"></div>
              <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-600/30 p-2.5">
                <img src={LOGO_URL} alt="โลโก้กลุ่มงานสังคมสงเคราะห์" className="w-full h-full object-contain" />
              </div>
              <div className="text-blue-300 text-xs font-semibold tracking-wider uppercase mb-1">กลุ่มงานสังคมสงเคราะห์</div>
              <h1 className="text-2xl font-bold text-white mb-2">D-Discharge System</h1>
              <p className="text-slate-400 text-sm">ระบบบันทึกและติดตามผู้ป่วยจำหน่ายยาก</p>
            </div>
            <div className="p-8">
              {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 text-center border border-red-100 font-medium">{error}</div>}
              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                  <input type="text" required value={username} onChange={e => setUsername(e.target.value)} className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" placeholder="กรอกชื่อผู้ใช้..." />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
                  <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 transition-shadow" placeholder="••••••••" />
                </div>
                <button type="submit" disabled={loading} className={`w-full py-2.5 rounded-lg text-white font-medium transition-all ${loading ? 'bg-blue-400' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg hover:shadow-blue-600/30'}`}>
                  {loading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ (Login)'}
                </button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    // 2. Change Password Modal
    const ChangePasswordModal = ({ isOpen, onClose, username, token, onAuthError }) => {
      const [oldPassword, setOldPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [status, setStatus] = useState({ type: '', msg: '' });
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if(newPassword !== confirmPassword) return setStatus({ type: 'error', msg: 'รหัสผ่านใหม่ทั้ง 2 ช่องไม่ตรงกัน' });
        if(newPassword.length < 6) return setStatus({ type: 'error', msg: 'รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร' });

        setLoading(true);
        setStatus({ type: '', msg: '' });
        try {
          const res = await apiPost('changePassword', { username, oldPassword, newPassword, token });
          setLoading(false);
          if (!res.success && onAuthError && onAuthError(res)) return;
          setStatus({ type: res.success ? 'success' : 'error', msg: res.message });
          if(res.success) setTimeout(() => { onClose(); setStatus({type:'',msg:''}); setOldPassword(''); setNewPassword(''); setConfirmPassword(''); }, 2000);
        } catch (err) {
          setLoading(false);
          setStatus({ type: 'error', msg: 'การเชื่อมต่อล้มเหลว โปรดลองอีกครั้ง' });
        }
      };

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden flex flex-col">
            <div className="px-6 py-4 border-b bg-gray-50 flex justify-between items-center"><h3 className="font-bold text-gray-800">เปลี่ยนรหัสผ่าน</h3><button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5"/></button></div>
            <div className="p-6">
              {status.msg && <div className={`p-3 rounded-lg text-sm mb-4 border ${status.type === 'error' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-green-50 text-green-700 border-green-100'}`}>{status.msg}</div>}
              <form id="pwd-form" onSubmit={handleSubmit} className="space-y-4">
                <div><label className="block text-sm font-medium mb-1 text-gray-700">รหัสผ่านเดิม</label><input type="password" required value={oldPassword} onChange={e=>setOldPassword(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-shadow"/></div>
                <div><label className="block text-sm font-medium mb-1 text-gray-700">รหัสผ่านใหม่ <span className="text-gray-400 font-normal">(6 ตัวอักษรขึ้นไป)</span></label><input type="password" required value={newPassword} onChange={e=>setNewPassword(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-shadow"/></div>
                <div><label className="block text-sm font-medium mb-1 text-gray-700">ยืนยันรหัสผ่านใหม่</label><input type="password" required value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} className="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-shadow"/></div>
              </form>
            </div>
            <div className="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
              <button onClick={onClose} type="button" className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium hover:bg-gray-100 transition-colors">ยกเลิก</button>
              <button type="submit" form="pwd-form" disabled={loading} className="px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 transition-colors">{loading ? 'กำลังบันทึก...' : 'บันทึก'}</button>
            </div>
          </div>
        </div>
      );
    };

    // 3. View History Modal
    const ViewHistoryModal = ({ isOpen, onClose, patient, token, onAuthError }) => {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        if (isOpen && patient) {
          setLoading(true);
          setError('');
          apiGet('getPatientHistory', { token, patientId: patient.id }).then((res) => {
            if (res.success) {
              setHistory(res.data || []);
            } else {
              if (!(onAuthError && onAuthError(res))) setError(res.message || 'โหลดประวัติไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
            }
            setLoading(false);
          }).catch(() => {
            setError('โหลดประวัติไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
            setLoading(false);
          });
        } else {
          setHistory([]);
        }
      }, [isOpen, patient]);

      if (!isOpen || !patient) return null;

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="px-6 py-4 border-b bg-gray-50 flex justify-between items-center">
              <h3 className="font-bold text-xl text-gray-800 flex items-center gap-2"><HistoryIcon className="w-5 h-5 text-blue-600" /> ประวัติการอัปเดตสถานะ</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-6 h-6"/></button>
            </div>

            <div className="p-6 overflow-y-auto bg-gray-50/50">
              <div className="mb-6 bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-center justify-between">
                <div>
                  <div className="font-bold text-gray-900 text-lg">{patient.name}</div>
                  <div className="text-sm text-gray-600 mt-1">HN: {patient.hn} | AN: {patient.an || '-'}</div>
                </div>
                <div className="text-right">
                  <div className="text-xs text-gray-500 mb-1">สถานะปัจจุบัน</div>
                  <StatusBadge status={patient.status} />
                </div>
              </div>

              <div className="space-y-4">
                {loading ? (
                  <div className="text-center py-10 text-gray-500 flex flex-col items-center">
                    <div className="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-3"></div>
                    กำลังโหลดประวัติ...
                  </div>
                ) : error ? (
                  <div className="text-center py-10 text-red-500 bg-white rounded-xl border border-red-200 border-dashed">{error}</div>
                ) : (!history || history.length === 0) ? (
                  <div className="text-center py-10 text-gray-500 bg-white rounded-xl border border-gray-200 border-dashed">
                    ยังไม่มีประวัติการเปลี่ยนแปลง
                  </div>
                ) : (
                  <div className="relative border-l-2 border-blue-200 ml-3 pl-5 space-y-6">
                    {history.map((h, idx) => (
                      <div key={idx} className="relative">
                        <div className="absolute -left-[27px] bg-blue-500 w-3 h-3 rounded-full border-2 border-white ring-4 ring-blue-50"></div>
                        <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3 border-b border-gray-50 pb-3">
                            <div className="text-sm font-bold text-gray-800 flex items-center gap-1.5"><Clock className="w-4 h-4 text-gray-400"/> {formatDateTime(h.timestamp)}</div>
                            <div className="text-xs font-medium text-blue-700 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-100">ผู้ทำรายการ: {h.updatedBy}</div>
                          </div>

                          <div className="space-y-2 mb-3">
                            <div className="flex flex-wrap items-center gap-2 text-sm">
                              <span className="text-gray-500">เปลี่ยนสถานะ:</span>
                              {h.oldStatus !== h.newStatus ? (
                                <><span className="line-through text-gray-400">{statusConfig[h.oldStatus]?.label || h.oldStatus}</span> <span className="text-gray-400">➔</span> <span className="font-semibold text-blue-600">{statusConfig[h.newStatus]?.label || h.newStatus}</span></>
                              ) : (
                                <span className="font-semibold text-gray-700">{statusConfig[h.newStatus]?.label || h.newStatus} (คงเดิม)</span>
                              )}
                            </div>

                            {h.oldIcd10 !== h.newIcd10 && (
                              <div className="flex flex-wrap items-center gap-2 text-sm">
                                <span className="text-gray-500">รหัสโรค ICD10:</span>
                                <span className="line-through text-gray-400">{h.oldIcd10 || '-'}</span> <span className="text-gray-400">➔</span> <span className="font-semibold text-blue-600">{h.newIcd10 || '-'}</span>
                              </div>
                            )}

                            {h.oldDischargeAgency !== h.newDischargeAgency && (h.oldDischargeAgency || h.newDischargeAgency) && (
                              <div className="flex flex-wrap items-center gap-2 text-sm">
                                <span className="text-gray-500">หน่วยงานที่ฝาก:</span>
                                <span className="line-through text-gray-400">{h.oldDischargeAgency || '-'}</span> <span className="text-gray-400">➔</span> <span className="font-semibold text-cyan-700">{h.newDischargeAgency || '-'}</span>
                              </div>
                            )}
                            {h.oldDischargeFinalStatus !== h.newDischargeFinalStatus && (h.oldDischargeFinalStatus || h.newDischargeFinalStatus) && (
                              <div className="flex flex-wrap items-center gap-2 text-sm">
                                <span className="text-gray-500">สถานะการส่งต่อจริง:</span>
                                <span className="line-through text-gray-400">{dischargeFinalStatusConfig[h.oldDischargeFinalStatus]?.label || h.oldDischargeFinalStatus || '-'}</span> <span className="text-gray-400">➔</span> <span className="font-semibold text-cyan-700">{dischargeFinalStatusConfig[h.newDischargeFinalStatus]?.label || h.newDischargeFinalStatus || '-'}</span>
                              </div>
                            )}

                            {(h.oldLetterNo !== h.newLetterNo || h.oldLetterStatus !== h.newLetterStatus) && (
                              <div className="text-sm bg-gray-50 p-2.5 rounded border border-gray-100">
                                <div className="text-gray-700 font-medium mb-1">มีการอัปเดตข้อมูลหนังสือ:</div>
                                <ul className="list-disc ml-5 text-gray-600 text-xs space-y-0.5">
                                  {h.oldLetterNo !== h.newLetterNo && <li>เลขที่หนังสือ: <span className="line-through">{h.oldLetterNo}</span> ➔ <span className="font-medium text-gray-800">{h.newLetterNo}</span></li>}
                                  {h.oldLetterStatus !== h.newLetterStatus && <li>สถานะหนังสือ: <span className="line-through">{h.oldLetterStatus}</span> ➔ <span className="font-medium text-gray-800">{h.newLetterStatus}</span></li>}
                                </ul>
                              </div>
                            )}
                          </div>

                          <div className="text-sm bg-blue-50/50 p-3 rounded-lg border border-blue-100 text-gray-700">
                            <span className="font-semibold text-blue-800">หมายเหตุ:</span> {h.note}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // 4. Add Patient Modal
    const AddPatientModal = ({ isOpen, onClose, onSave, settings }) => {
      const blankForm = { hn: '', an: '', name: '', icd10: '', ward: '', medReadyDate: '', reason: '', agency: '-', details: '', letterNo: '', letterDate: '', letterAgency: '', letterStatus: '' };
      const [formData, setFormData] = useState(blankForm);
      const [error, setError] = useState('');
      const [isSaving, setIsSaving] = useState(false);

      useEffect(() => { if (!isOpen) { setError(''); } }, [isOpen]);

      const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        setError('');
        const res = await onSave({ ...formData, status: 'New Case', reason: formData.reason || 'รอดำเนินการ', letterNo: formData.letterNo || '-', letterDate: formData.letterDate || '-', letterAgency: formData.letterAgency || '-', letterStatus: formData.letterStatus || '-' });
        setIsSaving(false);
        if (res && res.success === false) { setError(res.message || 'บันทึกข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); return; }
        setFormData(blankForm);
        onClose();
      };

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl overflow-hidden flex flex-col max-h-[95vh]">
            <div className="px-6 py-4 border-b bg-gray-50 flex justify-between items-center"><h3 className="font-bold text-xl text-gray-800">ลงทะเบียนผู้ป่วยจำหน่ายยาก</h3><button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-6 h-6"/></button></div>
            <div className="p-6 overflow-y-auto">
              {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-5 border border-red-100 font-medium flex items-start gap-2"><AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5"/><span>{error}</span></div>}
              <form id="add-form" onSubmit={handleSubmit} className="space-y-6">
                <div className="bg-blue-50/50 p-5 rounded-xl border border-blue-100">
                  <h4 className="font-bold text-blue-800 mb-4 flex items-center gap-2"><Users className="w-4 h-4"/> 1. ข้อมูลผู้ป่วยทั่วไป</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                    <div className="col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">HN</label><input required type="text" name="hn" value={formData.hn} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" /></div>
                    <div className="col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">AN</label><input type="text" name="an" value={formData.an} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" /></div>
                    <div className="col-span-1 sm:col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">ชื่อ-สกุล</label><input required type="text" name="name" value={formData.name} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" /></div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="col-span-1">
                      <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1"><Stethoscope className="w-3.5 h-3.5 text-emerald-500"/> โรค (ICD10)</label>
                      <input type="text" name="icd10" list="icd10-suggestions-add" value={formData.icd10} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" placeholder="เช่น E11, I63" />
                      <Icd10Datalist id="icd10-suggestions-add" />
                    </div>
                    <div className="col-span-1">
                      <label className="block text-sm font-medium text-gray-700 mb-1">หอผู้ป่วย</label>
                      <select required name="ward" value={formData.ward} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                        <option value="">-- เลือกหอผู้ป่วย --</option>
                        {settings?.wards && settings.wards.map((w,i) => <option key={i} value={w}>{w}</option>)}
                      </select>
                    </div>
                    <div className="col-span-1"><label className="block text-sm font-medium text-gray-700 mb-1">วันที่พร้อมจำหน่าย</label><input required type="date" name="medReadyDate" value={formData.medReadyDate} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" /></div>
                  </div>
                </div>

                <div className="bg-orange-50/50 p-5 rounded-xl border border-orange-100">
                  <h4 className="font-bold text-orange-800 mb-4 flex items-center gap-2"><AlertCircle className="w-4 h-4"/> 2. ข้อมูลการประเมินเบื้องต้น</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">สาเหตุหลักที่จำหน่ายไม่ได้</label>
                      <select required name="reason" value={formData.reason} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                        <option value="">-- เลือกสาเหตุ --</option>
                        <option value="ไร้ญาติ / ติดต่อญาติไม่ได้">ไร้ญาติ / ติดต่อญาติไม่ได้</option>
                        <option value="ญาติปฏิเสธการรับกลับ">ญาติปฏิเสธการรับกลับ</option>
                        <option value="รอส่งต่อสถานสงเคราะห์">รอส่งต่อสถานสงเคราะห์</option>
                        <option value="ไม่มีสถานะทางทะเบียนราษฎร์">ไม่มีสถานะทางทะเบียนราษฎร์</option>
                        <option value="รอปรับปรุงบ้าน/อุปกรณ์การแพทย์">รอปรับปรุงบ้าน/อุปกรณ์การแพทย์</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">หน่วยงานปลายทางเป้าหมาย (ถ้ามี)</label>
                      <select name="agency" value={formData.agency} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                        <option value="-">- ยังไม่ได้ระบุ -</option>
                        {settings?.agencies && settings.agencies.map((a,i) => <option key={i} value={a}>{a}</option>)}
                      </select>
                    </div>
                  </div>
                  <div><label className="block text-sm font-medium text-gray-700 mb-1">รายละเอียดเพิ่มเติม / การประเมินทางสังคม</label><textarea name="details" value={formData.details} onChange={handleChange} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" rows="2" placeholder="ใส่ข้อมูลเพิ่มเติมที่ควรรู้..."></textarea></div>
                </div>
              </form>
            </div>
            <div className="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
              <button onClick={onClose} type="button" className="px-5 py-2.5 border border-gray-300 rounded-lg text-sm font-medium bg-white hover:bg-gray-100 transition-colors">ยกเลิก</button>
              <button type="submit" form="add-form" disabled={isSaving} className="px-5 py-2.5 rounded-lg text-sm font-medium bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition-colors disabled:opacity-60">{isSaving ? 'กำลังบันทึก...' : 'บันทึกข้อมูลเข้าระบบ'}</button>
            </div>
          </div>
        </div>
      );
    };

    // Dashboard
    const MiniBarChart = ({ data }) => {
      const max = Math.max(1, ...data.map(d => d.count));
      const w = 560, h = 170, gap = 18;
      const barWidth = (w - gap * (data.length + 1)) / data.length;
      return (
        <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-40">
          {data.map((d, i) => {
            const barH = max > 0 ? (d.count / max) * (h - 40) : 0;
            const x = gap + i * (barWidth + gap);
            const y = h - 26 - barH;
            return (
              <g key={d.key}>
                <rect x={x} y={h - 26} width={barWidth} height={Math.max(barH, 2)} rx="5" className="fill-blue-500" style={{ transform: `translateY(${-barH}px)` }} />
                <text x={x + barWidth / 2} y={Math.max(y - 6, 12)} textAnchor="middle" className="fill-gray-600 text-[10px] font-bold">{d.count}</text>
                <text x={x + barWidth / 2} y={h - 8} textAnchor="middle" className="fill-gray-400 text-[10px]">{d.label}</text>
              </g>
            );
          })}
        </svg>
      );
    };

    const Dashboard = ({ patients, settings }) => {
      const activePatients = (patients || []).filter(p => !TERMINAL_STATUSES.includes(p.status));
      const totalCases = activePatients.length;
      const totalExtraDays = activePatients.reduce((sum, p) => sum + (Number(p.extraDays) || 0), 0);
      const avgExtraDays = totalCases > 0 ? (totalExtraDays / totalCases).toFixed(1) : 0;
      const awaitingAgencyCount = activePatients.filter(p => p.status === 'Awaiting Agency').length;
      const criticalCases = activePatients.filter(p => (Number(p.extraDays) || 0) > (settings?.criticalDays || 30)).length;

      const dischargedToAgencyPatients = useMemo(() => (patients || []).filter(p => p.status === 'Discharged To Agency'), [patients]);

      const icd10Counts = useMemo(() => {
        const counts = {};
        activePatients.forEach(p => {
          if (p.icd10 != null && String(p.icd10).trim() !== '' && String(p.icd10) !== '-') {
            const code = String(p.icd10).trim().toUpperCase();
            counts[code] = (counts[code] || 0) + 1;
          }
        });
        return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
      }, [activePatients]);

      const monthlyTrend = useMemo(() => {
        const months = [];
        const now = new Date();
        for (let i = 5; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          months.push({ key: `${d.getFullYear()}-${d.getMonth()}`, label: d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }), count: 0 });
        }
        (patients || []).forEach(p => {
          if (!p.medReadyDate) return;
          const d = new Date(p.medReadyDate);
          if (isNaN(d.getTime())) return;
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          const m = months.find(mm => mm.key === key);
          if (m) m.count++;
        });
        return months;
      }, [patients]);

      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold text-gray-800">ภาพรวมระบบ (Dashboard)</h2>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div className="bg-white rounded-xl shadow-sm p-5 border border-gray-100 hover:shadow-md transition-shadow">
              <div className="flex items-center text-gray-500 mb-2"><Users className="w-5 h-5 mr-2" /><span className="text-sm font-medium">ผู้ป่วย (กำลังดำเนินการ)</span></div>
              <div className="text-3xl font-bold text-gray-800">{totalCases} <span className="text-sm font-normal text-gray-500">ราย</span></div>
            </div>
            <div className="bg-white rounded-xl shadow-sm p-5 border border-gray-100 hover:shadow-md transition-shadow">
              <div className="flex items-center text-gray-500 mb-2"><Clock className="w-5 h-5 mr-2" /><span className="text-sm font-medium">วันส่วนเกินเฉลี่ย</span></div>
              <div className="text-3xl font-bold text-blue-600">{avgExtraDays} <span className="text-sm font-normal text-gray-500">วัน/ราย</span></div>
            </div>
            <div className="bg-orange-50 rounded-xl shadow-sm p-5 border border-orange-100 hover:shadow-md transition-shadow">
              <div className="flex items-center text-orange-600 mb-2"><Building2 className="w-5 h-5 mr-2" /><span className="text-sm font-medium">รอคิวสถานสงเคราะห์</span></div>
              <div className="text-3xl font-bold text-orange-700">{awaitingAgencyCount} <span className="text-sm font-normal text-orange-600/70">ราย</span></div>
            </div>
            <div className="bg-red-50 rounded-xl shadow-sm p-5 border border-red-100 hover:shadow-md transition-shadow">
              <div className="flex items-center text-red-600 mb-2"><AlertCircle className="w-5 h-5 mr-2" /><span className="text-sm font-medium">เคสวิกฤต (เกิน {settings?.criticalDays || 30} วัน)</span></div>
              <div className="text-3xl font-bold text-red-700">{criticalCases} <span className="text-sm font-normal text-red-600/70">ราย</span></div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="bg-white rounded-xl shadow-sm p-6 border border-gray-100 lg:col-span-2">
              <h3 className="text-lg font-bold text-gray-800 mb-4">สถานะการดำเนินงาน (Active Pipeline)</h3>
              <div className="space-y-4">
                {Object.entries(statusConfig).filter(([k]) => !TERMINAL_STATUSES.includes(k)).map(([statusKey, config]) => {
                  const count = activePatients.filter(p => p.status === statusKey).length;
                  const percentage = totalCases > 0 ? (count / totalCases) * 100 : 0;
                  return (
                    <div key={statusKey}>
                      <div className="flex justify-between text-sm mb-1"><span className="font-medium text-gray-700">{config.label}</span><span className="text-gray-500">{count} ราย</span></div>
                      <div className="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden"><div className={`h-full rounded-full transition-all duration-500 ${config.color.split(' ')[0]}`} style={{ width: `${percentage}%` }}></div></div>
                    </div>
                  )
                })}
              </div>
            </div>

            <div className="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
              <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2"><Stethoscope className="w-5 h-5 text-emerald-500" /> 5 อันดับโรค (ICD10) ที่พบบ่อย</h3>
              <div className="space-y-3">
                {icd10Counts.length > 0 ? (
                  icd10Counts.map(([code, count], index) => (
                    <div key={code} className="flex items-center justify-between p-3 bg-emerald-50/50 rounded-lg border border-emerald-100">
                      <div className="flex items-center gap-3">
                        <span className="text-emerald-700 font-bold text-lg w-5 text-center">{index + 1}.</span>
                        <span className="font-semibold text-gray-800 bg-white px-2 py-0.5 rounded shadow-sm border border-gray-200">{code}</span>
                      </div>
                      <div className="text-sm font-bold text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-full">{count} ราย</div>
                    </div>
                  ))
                ) : (
                   <div className="text-center py-6 text-gray-400 text-sm">ยังไม่มีข้อมูลการลงรหัส ICD10</div>
                )}
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><Building2 className="w-5 h-5 text-cyan-600" /> ติดตามผู้ป่วยที่ฝากหน่วยงานอื่น</h3>
              <span className="text-sm font-semibold text-cyan-700 bg-cyan-50 px-3 py-1 rounded-full border border-cyan-100">{dischargedToAgencyPatients.length} ราย</span>
            </div>
            <p className="text-xs text-gray-400 mb-4">เคสที่จำหน่ายออกจากโรงพยาบาลแล้ว แต่ยังติดตามจนกว่าจะส่งตัวจริงไปสถานสงเคราะห์สำเร็จ</p>
            {dischargedToAgencyPatients.length === 0 ? (
              <div className="text-center py-8 text-gray-400 text-sm bg-gray-50 rounded-lg border border-dashed border-gray-200">ไม่มีเคสที่ฝากหน่วยงานอื่นอยู่ในขณะนี้</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm text-gray-600">
                  <thead className="bg-gray-50 text-gray-700 border-b border-gray-200">
                    <tr>
                      <th className="px-3 py-2.5 font-semibold">ผู้ป่วย</th>
                      <th className="px-3 py-2.5 font-semibold">หน่วยงานที่ฝาก</th>
                      <th className="px-3 py-2.5 font-semibold text-center">ฝากมาแล้ว (วัน)</th>
                      <th className="px-3 py-2.5 font-semibold">สถานะการส่งตัวจริง</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {dischargedToAgencyPatients.map(p => {
                      const days = p.dischargeDate && p.dischargeDate !== '-' ? calculateExtraDays(p.dischargeDate) : null;
                      const finalCfg = dischargeFinalStatusConfig[p.dischargeFinalStatus];
                      return (
                        <tr key={p.id} className="hover:bg-cyan-50/30">
                          <td className="px-3 py-2.5 font-medium text-gray-800">{p.name} <span className="text-gray-400 font-normal">(HN {p.hn})</span></td>
                          <td className="px-3 py-2.5">{p.dischargeAgency && p.dischargeAgency !== '-' ? p.dischargeAgency : '-'}</td>
                          <td className={`px-3 py-2.5 text-center font-bold ${days !== null && days > 30 ? 'text-red-600' : 'text-gray-700'}`}>{days !== null ? days : '-'}</td>
                          <td className="px-3 py-2.5">{finalCfg ? <span className={`px-2 py-0.5 rounded-full text-xs border font-medium ${finalCfg.color}`}>{finalCfg.label}</span> : <span className="text-gray-400 text-xs italic">ยังไม่ระบุ</span>}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          <div className="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <h3 className="text-lg font-bold text-gray-800 mb-1">แนวโน้มเคสใหม่รายเดือน</h3>
            <p className="text-xs text-gray-400 mb-4">นับจากวันที่แพทย์ให้กลับ (medReadyDate) ย้อนหลัง 6 เดือน</p>
            <MiniBarChart data={monthlyTrend} />
          </div>
        </div>
      );
    };

    // UpdateStatusModal
    const UpdateStatusModal = ({ isOpen, onClose, onSave, patient, settings }) => {
      const [newStatus, setNewStatus] = useState('');
      const [note, setNote] = useState('');

      const [icd10, setIcd10] = useState('');
      const [letterNo, setLetterNo] = useState('');
      const [letterDate, setLetterDate] = useState('');
      const [letterAgency, setLetterAgency] = useState('');
      const [letterStatus, setLetterStatus] = useState('');
      const [dischargeAgency, setDischargeAgency] = useState('');
      const [dischargeDate, setDischargeDate] = useState('');
      const [dischargeFinalStatus, setDischargeFinalStatus] = useState('');

      const [isSaving, setIsSaving] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        if (patient) {
          setNewStatus(patient.status);
          setIcd10(patient.icd10 || '');
          setLetterNo(patient.letterNo && patient.letterNo !== '-' ? patient.letterNo : '');
          setLetterDate(patient.letterDate && patient.letterDate !== '-' ? patient.letterDate : '');
          setLetterAgency(patient.letterAgency && patient.letterAgency !== '-' ? patient.letterAgency : '');
          setLetterStatus(patient.letterStatus && patient.letterStatus !== '-' ? patient.letterStatus : '');
          setDischargeAgency(patient.dischargeAgency && patient.dischargeAgency !== '-' ? patient.dischargeAgency : '');
          setDischargeDate(patient.dischargeDate && patient.dischargeDate !== '-' ? patient.dischargeDate : new Date().toISOString().split('T')[0]);
          setDischargeFinalStatus(patient.dischargeFinalStatus && patient.dischargeFinalStatus !== '-' ? patient.dischargeFinalStatus : '');
          setError('');
        }
      }, [patient]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSaving(true);
        setError('');
        const res = await onSave(patient.id, newStatus, note, letterNo, letterDate, letterAgency, letterStatus, icd10, dischargeAgency, dischargeDate, dischargeFinalStatus);
        setIsSaving(false);
        if (res && res.success === false) { setError(res.message || 'บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); return; }
        setNote('');
        onClose();
      };

      if (!isOpen || !patient) return null;
      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[95vh]">
            <div className="px-6 py-4 border-b bg-gray-50 flex justify-between items-center">
              <h3 className="font-bold text-xl text-gray-800">จัดการ / อัปเดตข้อมูลและสถานะ</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><X className="w-6 h-6"/></button>
            </div>

            <div className="p-6 overflow-y-auto">
              {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-5 border border-red-100 font-medium flex items-start gap-2"><AlertCircle className="w-4 h-4 flex-shrink-0 mt-0.5"/><span>{error}</span></div>}
              <div className="mb-6 bg-blue-50/50 p-4 rounded-xl border border-blue-100 flex items-center justify-between">
                <div>
                  <div className="font-bold text-blue-900 text-lg">{patient.name}</div>
                  <div className="text-sm text-blue-700 mt-1">HN: {patient.hn} | AN: {patient.an || '-'}</div>
                </div>
                <div className="text-right">
                  <div className="text-xs text-blue-500 mb-1">สถานะปัจจุบัน</div>
                  <StatusBadge status={patient.status} />
                </div>
              </div>

              <form id="update-status-form" onSubmit={handleSubmit} className="space-y-6">

                <div>
                  <h4 className="font-semibold text-gray-800 mb-3 border-b pb-2">อัปเดตข้อมูลทั่วไป</h4>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                     <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1 flex items-center gap-1"><Stethoscope className="w-4 h-4 text-emerald-500"/> โรค (ICD10)</label>
                        <input type="text" list="icd10-suggestions-update" value={icd10} onChange={e => setIcd10(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm" placeholder="เช่น E11, I63" />
                        <Icd10Datalist id="icd10-suggestions-update" />
                     </div>
                     <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">เปลี่ยนสถานะใหม่</label>
                      <select required value={newStatus} onChange={e => setNewStatus(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm font-medium text-blue-700">
                        {Object.entries(statusConfig).map(([key, config]) => <option key={key} value={key}>{config.label}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                {newStatus === 'Letter Sent' && (
                  <div className="animate-fade-in">
                    <h4 className="font-semibold text-gray-800 mb-3 border-b pb-2 flex items-center gap-2"><Mail className="w-4 h-4 text-gray-500"/> อัปเดตข้อมูลการส่งหนังสือราชการ</h4>
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">เลขที่หนังสือ</label>
                          <input type="text" value={letterNo} onChange={e => setLetterNo(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" placeholder="เช่น สธ ๐๘..." />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">วันที่ส่งหนังสือ</label>
                          <input type="date" value={letterDate} onChange={e => setLetterDate(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" />
                        </div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">หน่วยงานที่รับหนังสือ</label>
                          <select value={letterAgency} onChange={e => setLetterAgency(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                            <option value="">-- เลือกหน่วยงาน --</option>
                            {settings?.agencies && settings.agencies.map((a,i) => <option key={i} value={a}>{a}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">สถานะหนังสือ</label>
                          <select value={letterStatus} onChange={e => setLetterStatus(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm">
                            <option value="">-- เลือกสถานะ --</option>
                            <option value="ส่งแล้ว/รอตอบรับ">ส่งแล้ว/รอตอบรับ</option>
                            <option value="หน่วยงานตอบรับแล้ว">หน่วยงานตอบรับแล้ว</option>
                            <option value="หน่วยงานปฏิเสธ/เตียงเต็ม">หน่วยงานปฏิเสธ/เตียงเต็ม</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {newStatus === 'Discharged To Agency' && (
                  <div className="animate-fade-in">
                    <h4 className="font-semibold text-gray-800 mb-3 border-b pb-2 flex items-center gap-2"><Building2 className="w-4 h-4 text-cyan-600"/> ติดตามการฝากหน่วยงานอื่น</h4>
                    <div className="bg-cyan-50/50 p-4 rounded-xl border border-cyan-100 space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">หน่วยงานที่ฝากดูแล <span className="text-red-500">*</span></label>
                          <select required value={dischargeAgency} onChange={e => setDischargeAgency(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-cyan-500 bg-white shadow-sm">
                            <option value="">-- เลือกหน่วยงาน --</option>
                            {settings?.agencies && settings.agencies.map((a,i) => <option key={i} value={a}>{a}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">วันที่ฝากหน่วยงาน (จำหน่ายออกจาก รพ.) <span className="text-red-500">*</span></label>
                          <input required type="date" value={dischargeDate} onChange={e => setDischargeDate(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-cyan-500 shadow-sm" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">สถานะการส่งต่อสถานสงเคราะห์จริง <span className="text-red-500">*</span></label>
                        <select required value={dischargeFinalStatus} onChange={e => setDischargeFinalStatus(e.target.value)} className="w-full border border-gray-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-cyan-500 bg-white shadow-sm font-medium text-cyan-800">
                          <option value="">-- เลือกสถานะ --</option>
                          {Object.entries(dischargeFinalStatusConfig).map(([key, cfg]) => <option key={key} value={key}>{cfg.label}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                )}

                <div>
                  <h4 className="font-semibold text-gray-800 mb-3 border-b pb-2">บันทึกความคืบหน้า</h4>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">หมายเหตุ / ประวัติการดำเนินงาน <span className="text-red-500">*</span></label>
